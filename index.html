<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>Venom | پیام‌رسان</title>
<style>
:root{--bg:#090a0d;--panel:#111318;--panel2:#191c23;--line:#292d36;--gold:#d7b35b;--gold2:#f1d88d;--text:#f4f4f5;--muted:#a0a4ae;--danger:#f87171;--green:#67d6a0;--blue:#7db8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh;max-height:100vh}.sidebar{border-left:1px solid var(--line);background:#0d0f13;display:flex;flex-direction:column;min-height:0}.brand{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid var(--line)}.logo{width:43px;height:43px;border:1px solid var(--gold);border-radius:13px;display:grid;place-items:center;color:var(--gold);font-size:25px;font-weight:bold;box-shadow:0 0 18px #d7b35b12}.brand h1{font-size:19px;margin:0;letter-spacing:1px}.brand small{color:var(--muted);display:block;margin-top:4px;font-size:11px}.side-actions{display:flex;gap:8px;padding:12px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:10px}.btn.gold{background:var(--gold);color:#17130a;border-color:var(--gold);font-weight:bold}.btn:hover{filter:brightness(1.1)}.search{margin:0 12px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);width:calc(100% - 24px)}.tabs{display:flex;gap:5px;padding:0 12px 10px}.tab{flex:1;border:0;border-radius:8px;background:transparent;color:var(--muted);padding:8px 2px;font-size:12px}.tab.active{background:#d7b35b20;color:var(--gold2)}.list{overflow:auto;flex:1;padding:0 8px 12px}.item{display:flex;gap:10px;align-items:center;padding:11px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent}.item:hover,.item.active{background:var(--panel2);border-color:var(--line)}.avatar{flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2a2d34,#17191f);border:1px solid #424650;color:var(--gold2);font-weight:bold}.item-main{min-width:0;flex:1}.item-title{font-size:14px;font-weight:bold;display:flex;gap:5px;align-items:center}.item-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.pill{font-size:10px;color:var(--gold);border:1px solid #6f5b2b;border-radius:5px;padding:2px 4px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.topbar{height:72px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#0d0f13}.peer{display:flex;gap:10px;align-items:center;min-width:0}.peer h2{font-size:15px;margin:0}.peer p{font-size:11px;color:var(--muted);margin:5px 0 0}.top-actions{display:flex;gap:7px}.iconbtn{width:39px;height:39px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--gold2);font-size:17px}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(ellipse at 50% 0%,#d7b35b08,transparent 55%)}.empty{margin:auto;text-align:center;color:var(--muted);max-width:340px;line-height:1.9}.empty strong{color:var(--gold2);font-size:22px;display:block}.msg{max-width:min(72%,560px);padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:#171a20;align-self:flex-start;overflow-wrap:anywhere;line-height:1.7}.msg.mine{align-self:flex-end;background:#292317;border-color:#62502b}.msg .time{font-size:10px;color:var(--muted);text-align:left;margin-top:4px}.composer{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:9px;background:#0d0f13}.composer textarea{resize:none;min-height:43px;max-height:120px;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px}.send{width:48px;border-radius:12px;border:0;background:var(--gold);color:#15120a;font-size:19px}.view{display:none;flex:1;overflow:auto;padding:24px}.view.active{display:block}.section-title{margin:0 0 8px;font-size:22px}.sub{color:var(--muted);font-size:13px;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.card h3{margin:0 0 12px;font-size:15px}.stat{font-size:27px;color:var(--gold2);font-weight:bold}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-top:18px}.field{display:flex;flex-direction:column;gap:7px}.field label{color:var(--muted);font-size:12px}.field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text)}.field textarea{min-height:90px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.notice{padding:12px 14px;border:1px solid #6f5b2b;background:#d7b35b0d;color:var(--gold2);border-radius:10px;font-size:12px;line-height:1.8;margin-top:14px}.danger{color:var(--danger)}.mobile-nav{display:none}.hidden{display:none!important}.contact-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}.contact-meta{color:var(--muted);font-size:12px;margin-top:5px}.modal-back{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-back.open{display:flex}.modal{background:var(--panel);border:1px solid var(--line);border-radius:17px;width:min(460px,100%);padding:20px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.modal-close{background:transparent;border:0;color:var(--muted);font-size:24px}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{height:100vh}.topbar{height:65px;padding:10px 12px}.messages{padding:14px}.msg{max-width:88%}.view{padding:18px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0d0f13;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:6px}.mobile-nav button span{display:block;font-size:19px;margin-bottom:4px}.mobile-nav button.active{color:var(--gold)}.composer{padding-bottom:calc(14px + 52px + env(safe-area-inset-bottom))}.messages{padding-bottom:75px}.view{padding-bottom:80px}.top-actions .optional{display:none}}
.auth-backdrop{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 0%,#d7b35b18,transparent 55%),#07090df5;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}.auth-card{width:min(440px,100%);background:linear-gradient(160deg,#111823,#090d13);border:1px solid #3a3424;border-radius:24px;padding:28px;box-shadow:0 25px 90px #0009}.auth-brand{text-align:center;margin-bottom:24px}.auth-mark{width:68px;height:68px;margin:0 auto 12px;border:1px solid var(--gold);border-radius:20px;display:grid;place-items:center;font-size:38px;font-weight:bold;color:var(--gold2);box-shadow:0 0 32px #d7b35b18}.auth-brand h1{margin:0;letter-spacing:3px}.auth-brand p,.auth-help{font-size:12px;color:var(--muted);line-height:1.9}.auth-card h2{font-size:20px;margin:0 0 8px}.auth-card label{font-size:13px;color:#d5d8df}.auth-card input[type=tel],.auth-card input[type=text]{width:100%;margin-top:8px;padding:13px;background:#0b111a;border:1px solid #303a49;border-radius:12px;color:#fff;direction:ltr;text-align:left}.auth-check{display:flex;align-items:flex-start;gap:9px;margin:15px 0;line-height:1.8;font-size:12px}.auth-check input{margin-top:5px;accent-color:var(--gold)}.auth-link{border:0;background:transparent;color:#7db8ff;padding:0;font-size:12px}.auth-submit{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#d7b35b,#f1d88d);font-weight:bold;color:#17130a}.auth-submit:disabled{opacity:.45;cursor:not-allowed}.auth-status{font-size:12px;line-height:1.8;color:var(--gold2);min-height:20px;margin:10px 0}.auth-hidden{display:none!important}
</style>
</head>
<body>
<div id="authGate" class="auth-backdrop">
 <div class="auth-card">
  <div class="auth-brand"><div class="auth-mark">V</div><h1>VENOM</h1><p>پیام‌رسان امن و ساده</p></div>
  <section id="authPhoneStep"><h2>ورود یا ساخت حساب</h2><p class="auth-help">شماره موبایلت را وارد کن. کد تایید پیامک می‌شود.</p>
   <label for="authPhone">شماره موبایل</label><input id="authPhone" type="tel" autocomplete="tel" placeholder="09123456789" maxlength="20">
   <div class="auth-check"><input id="authTerms" type="checkbox"><label for="authTerms">قوانین را می‌پذیرم.</label></div>
   <div class="auth-status" id="authStatus" aria-live="polite"></div><button class="auth-submit" id="authSendCode" disabled>پذیرش قوانین و دریافت کد</button>
  </section>
  <section id="authCodeStep" class="auth-hidden"><h2>کد تأیید را وارد کن</h2><p class="auth-help" id="authSentTo"></p><label for="authCode">کد ۶ رقمی</label><input id="authCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------"><div class="auth-status" id="authCodeStatus" aria-live="polite"></div><button class="auth-submit" id="authVerify">تأیید و ورود</button><p class="auth-help"><button class="auth-link" id="authBack" type="button">بازگشت</button></p></section>
 </div>
</div>

<div class="app hidden" id="mainApp">
<aside class="sidebar">
 <div class="brand"><div class="logo">V</div><div><h1>VENOM</h1><small>پیام‌رسان شما</small></div></div>
 <div class="side-actions"><button class="btn gold" id="newChatBtn">＋ گفت‌وگوی جدید</button></div>
 <input id="search" class="search" placeholder="جست‌وجوی مخاطب…">
 <div class="list" id="chatList"></div>
</aside>
<main class="main">
 <header class="topbar"><div class="peer"><div class="avatar" id="headAvatar">V</div><div><h2 id="headTitle">به ونوم خوش آمدی</h2><p id="headSub">یک گفت‌وگو را انتخاب کن</p></div></div><div class="top-actions"><button class="iconbtn" id="settingsShortcut">⚙</button></div></header>
 <section class="messages" id="messages"><div class="empty"><strong>VENOM</strong>یک مخاطب را جستجو کن و شروع به چت کن.</div></section>
 <form class="composer" id="composer"><textarea id="messageInput" rows="1" placeholder="پیامت را بنویس…" aria-label="متن پیام"></textarea><button class="send" type="submit" aria-label="ارسال">➤</button></form>
 <section class="view" id="settingsView"><h2 class="section-title">تنظیمات پروفایل</h2><p class="sub">تغییرات در سرور ذخیره می‌شود.</p><div class="form-grid"><div class="field"><label>نام نمایشی</label><input id="settingName" maxlength="40"></div><div class="field"><label>نام کاربری</label><input id="settingUsername" maxlength="30"></div><div class="field"><label>درباره من</label><input id="settingBio" maxlength="120"></div></div><div class="row" style="margin-top:18px"><button class="btn gold" id="saveSettings">ذخیره تنظیمات</button><button class="btn danger" id="logoutBtn">خروج از حساب</button></div></section>
</main>
</div>
<nav class="mobile-nav"><button class="active" data-view="chat"><span>▤</span>گفت‌وگوها</button><button data-view="settings"><span>⚙</span>تنظیمات</button></nav>

<script>
const AUTH_TOKEN_KEY='venom_auth_token';
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentUser = null, currentChat = null, pollInterval = null;

async function api(path, method='GET', body=null) {
    const token = localStorage.getItem(AUTH_TOKEN_KEY);
    const headers = {'Content-Type': 'application/json'};
    if(token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'خطا در ارتباط با سرور');
    return data;
}

// Auth Logic
$('authTerms').onchange = () => $('authSendCode').disabled = !$('authTerms').checked;
$('authSendCode').onclick = async () => {
    $('authSendCode').disabled = true;
    $('authStatus').textContent = 'در حال ارسال...';
    try {
        const d = await api('/api/auth/request-code', 'POST', { phone: $('authPhone').value });
        $('authPhoneStep').classList.add('auth-hidden');
        $('authCodeStep').classList.remove('auth-hidden');
        $('authSentTo').textContent = d.message || 'کد ارسال شد.';
    } catch(e) { $('authStatus').textContent = e.message; }
    finally { $('authSendCode').disabled = !$('authTerms').checked; }
};
$('authVerify').onclick = async () => {
    $('authVerify').disabled = true;
    try {
        const d = await api('/api/auth/verify-code', 'POST', { 
            phone: $('authPhone').value, 
            code: $('authCode').value, 
            accepted_terms: true 
        });
        localStorage.setItem(AUTH_TOKEN_KEY, d.token);
        initApp();
    } catch(e) { $('authCodeStatus').textContent = e.message; }
    finally { $('authVerify').disabled = false; }
};

async function initApp() {
    try {
        const d = await api('/api/auth/me');
        currentUser = d.user;
        $('authGate').classList.add('auth-hidden');
        $('mainApp').classList.remove('hidden');
        $('settingName').value = currentUser.name || '';
        $('settingUsername').value = currentUser.username || '';
        $('settingBio').value = currentUser.bio || '';
        document.querySelector('.composer').style.display = 'none';
        document.querySelector('.messages').style.display = 'flex';
    } catch(e) {
        localStorage.removeItem(AUTH_TOKEN_KEY);
        $('authGate').classList.remove('auth-hidden');
    }
}

// Settings Logic
$('settingsShortcut').onclick = () => {
    $('messages').style.display = 'none';
    document.querySelector('.composer').style.display = 'none';
    $('settingsView').classList.add('active');
};
document.querySelector('.mobile-nav button[data-view="chat"]').onclick = () => {
    $('settingsView').classList.remove('active');
    $('messages').style.display = 'flex';
    if(currentChat) document.querySelector('.composer').style.display = 'flex';
};
$('saveSettings').onclick = async () => {
    try {
        await api('/api/users/profile', 'POST', {
            name: $('settingName').value,
            username: $('settingUsername').value,
            bio: $('settingBio').value
        });
        alert('تنظیمات ذخیره شد!');
    } catch(e) { alert(e.message); }
};
$('logoutBtn').onclick = () => {
    localStorage.removeItem(AUTH_TOKEN_KEY);
    location.reload();
};

// Chat Logic
$('newChatBtn').onclick = async () => {
    const phone = prompt('شماره کاربر را وارد کنید:');
    if(!phone) return;
    try {
        const d = await api('/api/users/search?q=' + encodeURIComponent(phone));
        if(d.users.length > 0) {
            startChat(d.users[0]);
        } else {
            alert('کاربری با این شماره پیدا نشد.');
        }
    } catch(e) { alert(e.message); }
};

function startChat(user) {
    currentChat = user;
    $('headTitle').textContent = user.name || user.phone;
    $('headSub').textContent = user.phone;
    $('headAvatar').textContent = (user.name || 'V')[0];
    $('settingsView').classList.remove('active');
    $('messages').style.display = 'flex';
    document.querySelector('.composer').style.display = 'flex';
    loadMessages();
    if(pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(loadMessages, 3000);
}

async function loadMessages() {
    if(!currentChat) return;
    try {
        const d = await api('/api/messages?with_user_id=' + currentChat.id);
        if(d.messages.length === 0) {
            $('messages').innerHTML = '<div class="empty"><strong>گفت‌وگوی تازه</strong>اولین پیام را بنویس.</div>';
        } else {
            $('messages').innerHTML = d.messages.map(m => `
                <div class="msg ${m.sender_id === currentUser.id ? 'mine' : ''}">
                    ${escapeHTML(m.body).replace(/\n/g,'<br>')}
                    <div class="time">${new Date(m.created_at * 1000).toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'})}</div>
                </div>
            `).join('');
        }
        $('messages').scrollTop = $('messages').scrollHeight;
    } catch(e) { console.error(e); }
}

$('composer').onsubmit = async (e) => {
    e.preventDefault();
    const text = $('messageInput').value.trim();
    if(!text || !currentChat) return;
    $('messageInput').value = '';
    try {
        await api('/api/messages', 'POST', { recipient_id: currentChat.id, body: text });
        loadMessages();
    } catch(e) { alert(e.message); }
};

initApp();
</script>
</body>
</html>
