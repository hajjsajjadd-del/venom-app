<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Venom Control Center</title><style>:root{color-scheme:dark;--bg:#0b1220;--panel:#111c30;--line:#26354e;--text:#eef4ff;--muted:#9eacc3;--blue:#3b82f6;--gold:#d7b56d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Tahoma,Arial}main{max-width:1100px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{color:var(--gold);font-weight:900;font-size:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button{font:inherit;border-radius:10px;padding:11px 12px;border:1px solid var(--line);background:#0b1425;color:var(--text)}input{min-width:0;flex:1}button{cursor:pointer;background:var(--blue);border:0;font-weight:700}button.secondary{background:#26354e}button.danger{background:#a83b48}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:12px}.num{font-size:25px;font-weight:800;color:var(--gold)}.muted{color:var(--muted)}.status{margin:10px 0;color:var(--gold);white-space:pre-wrap}.user{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.user:last-child{border:0}.small{font-size:12px}.hide{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap}.report{padding:12px 0;border-bottom:1px solid var(--line);line-height:1.8}@media(max-width:600px){main{padding:12px}.user{grid-template-columns:1fr}.user .row button{flex:1}}</style></head><body><main><div class="head"><div><div class="brand">◈ VENOM CONTROL CENTER</div><div class="muted">مدیریت حساب‌ها، تعلیق و گزارش‌ها</div></div><span class="muted small">کلید فقط در همین نشست نگهداری می‌شود</span></div><section class="panel"><h3>ورود مدیر</h3><div class="row"><input id="key" type="password" autocomplete="current-password" placeholder="کلید مدیریت (VENOM_ADMIN_KEY)"><button id="connect">اتصال</button></div><div class="status" id="status"></div><p class="muted small">کلید را در اختیار دیگران قرار نده. از کلید طولانی و تصادفی استفاده کن و فقط از HTTPS وارد این صفحه شو.</p></section><section id="dashboard" class="hide"><div class="panel"><h3>آمار سامانه</h3><div id="stats" class="stats"></div></div><div class="panel"><h3>مدیریت کاربران</h3><div class="row"><input id="search" placeholder="جست‌وجو با شماره تلفن"><button id="refresh" class="secondary">تازه‌سازی</button></div><div id="users"></div></div><div class="panel"><h3>گزارش‌های کاربران</h3><div id="reports"></div></div></section></main><script>
const $=id=>document.getElementById(id);let key='';function msg(t){$('status').textContent=t}async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Venom-Admin-Key':key},body:body===undefined?undefined:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw Error(d.error||'درخواست ناموفق بود');return d}function fmt(ts){return ts?new Date(ts*1000).toLocaleString('fa-IR'):'—'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const [s,u,r]=await Promise.all([api('/api/admin/stats'),api('/api/admin/users?q='+encodeURIComponent($('search').value)),api('/api/admin/reports')]);$('stats').innerHTML=Object.entries({'کل کاربران':s.stats.users,'فعال':s.stats.active,'تعلیق‌شده':s.stats.suspended,'پیام‌ها':s.stats.messages,'گزارش باز':s.stats.open_reports}).map(([k,v])=>`<div class="stat"><div class="muted">${k}</div><div class="num">${v}</div></div>`).join('');$('users').innerHTML=u.users.length?u.users.map(x=>`<div class="user"><div><strong>${esc(x.display_name||x.phone)}</strong> <span class="muted small">${esc(x.phone)} · #${x.id} · ${x.role==='creator'?'سازنده':x.role==='admin'?'مدیر':'کاربر'}</span><div class="muted small">وضعیت: ${x.status==='suspended'?'تعلیق‌شده':'فعال'} · ثبت‌نام: ${fmt(x.created_at)}${x.suspended_until?' · پایان تعلیق: '+fmt(x.suspended_until):''}${x.suspension_reason?' · دلیل: '+esc(x.suspension_reason):''}</div></div><div class="row">${['creator','admin'].includes(x.role)?'<span class="muted small">حساب محافظت‌شده</span>':x.status==='suspended'?`<button class="secondary" onclick="unsuspend(${x.id})">رفع تعلیق</button>`:`<button onclick="suspend(${x.id})">تعلیق</button>`}${['creator','admin'].includes(x.role)?'':`<button class="danger" onclick="removeUser(${x.id},'${esc(x.phone)}')">حذف حساب</button>`}</div></div>`).join(''):'<p class="muted">کاربری پیدا نشد.</p>';$('reports').innerHTML=r.reports.length?r.reports.map(x=>`<div class="report"><strong>گزارش #${x.id}</strong> · کاربر هدف: ${esc(x.target_phone)} · گزارش‌دهنده: ${esc(x.reporter_phone)}<div class="muted small">${fmt(x.created_at)} · وضعیت: ${x.status==='open'?'باز':'بسته'}</div><div>${esc(x.reason)}</div>${x.status==='open'?`<button class="secondary" onclick="closeReport(${x.id})">بستن گزارش</button>`:''}</div>`).join(''):'<p class="muted">گزارشی ثبت نشده است.</p>';$('dashboard').classList.remove('hide');msg('اتصال موفق بود.')}
window.suspend=async id=>{const reason=prompt('دلیل تعلیق:');if(!reason)return;const hours=prompt('مدت تعلیق به ساعت (۱ تا ۸۷۶۰):','24');if(hours===null)return;try{await api(`/api/admin/users/${id}/suspend`,'POST',{reason,hours:Number(hours)});await load()}catch(e){alert(e.message)}};window.unsuspend=async id=>{try{await api(`/api/admin/users/${id}/unsuspend`,'POST',{});await load()}catch(e){alert(e.message)}};window.removeUser=async(id,phone)=>{if(!confirm('حذف دائمی حساب '+phone+' و پیام‌های مرتبط؟'))return;try{await api(`/api/admin/users/${id}`,'DELETE');await load()}catch(e){alert(e.message)}};window.closeReport=async id=>{try{await api(`/api/admin/reports/${id}/close`,'POST',{});await load()}catch(e){alert(e.message)}};$('connect').onclick=async()=>{key=$('key').value.trim();if(!key)return msg('کلید مدیریت را وارد کن.');try{await load()}catch(e){$('dashboard').classList.add('hide');msg(e.message)}};$('refresh').onclick=()=>load().catch(e=>msg(e.message));$('search').onkeydown=e=>{if(e.key==='Enter')load().catch(e=>msg(e.message))};
</script></body></html>
